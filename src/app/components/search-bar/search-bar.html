<div class="search-box">
    <img src="img/search.svg" alt="Search">
    <input 
        id="live-search"  
        type="search" 
        placeholder="Search..."
        autocomplete="off"
        [ngModel]="search()"
        (ngModelChange)="updateSearch($event)"
    >
    <button (click)="searchClicked()">Search</button>
</div>
